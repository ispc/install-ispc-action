name: Test install ISPC action

permissions: read-all

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to checkout (owner/repo)'
        required: true
        default: 'ispc/install-ispc-action'
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'main'
      spike_runs:
        description: 'Bash start-up attempts for the windows-11-arm spike'
        required: false
        default: '50'
  pull_request:

jobs:
  interface:
    # A1-A3: only runs: may differ from the last Node release of action.yml.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Compare action.yml with the Node baseline
        run: |
          git show 11452bc:action.yml | yq -o json 'del(.runs)' > old.json
          yq -o json 'del(.runs)' action.yml > new.json
          diff -u old.json new.json
          echo "name, description, author, inputs and outputs are unchanged"

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-2025, windows-11-arm, macos-15, macos-latest, macos-15-intel]
        version: [latest, 1.23.0]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - name: Install ISPC
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Check ISPC version (C2)
        if: matrix.version != 'latest'
        shell: pwsh
        run: |
          $output = & ispc --version | Out-String
          if ($output -match "${{ matrix.version }}") {
            Write-Output "Expected version ${{ matrix.version }} found"
          } else {
            Write-Output "Expected version ${{ matrix.version }}, got $output"
            exit 1
          }

      - name: ISPC version
        run: ispc --version

      - name: ISPC support matrix
        run: ispc --support-matrix

      - name: Bin dir first in PATH, bash (C3)
        shell: bash
        run: |
          first=$(printf '%s' "$PATH" | cut -d: -f1)
          echo "First PATH entry: $first"
          case "$first" in */ispc-releases/ispc-v*/bin) ;; *) exit 1 ;; esac
          [[ $(command -v ispc) == "$first/ispc"* ]]

      - name: Bin dir first in PATH, pwsh (C3)
        shell: pwsh
        run: |
          $first = ($env:PATH -split [IO.Path]::PathSeparator)[0]
          Write-Output "First PATH entry: $first"
          if ($first -notmatch '[\\/]ispc-releases[\\/]ispc-v[^\\/]+[\\/]bin$') { exit 1 }
          $expected = Join-Path $env:GITHUB_WORKSPACE 'ispc-releases'
          if (-not $first.StartsWith($expected)) { Write-Output "Not under $expected"; exit 1 }

      - name: Bin dir first in PATH, cmd (C3)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "tokens=1 delims=;" %%p in ("%PATH%") do echo First PATH entry: %%p
          where ispc
          ispc --version

  readme-quickstart:
    # A4, A5: README examples as written, with only the default read-all permissions.
    runs-on: ubuntu-latest
    name: build
    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        repository: ${{ inputs.repo || github.repository }}
        ref: ${{ inputs.branch || github.ref }}
    - name: install ISPC
      uses: ./
    - run: ispc --version

  readme-version:
    runs-on: ubuntu-latest
    name: build
    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        repository: ${{ inputs.repo || github.repository }}
        ref: ${{ inputs.branch || github.ref }}
    - name: install ISPC
      uses: ./
      with:
        version: 1.22.0
    - run: ispc --version | grep -F 1.22.0

  readme-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux

        - os: windows-latest
          platform: windows

        - os: macos-latest
          platform: macOS

    runs-on: ${{ matrix.os }}
    name: build
    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        repository: ${{ inputs.repo || github.repository }}
        ref: ${{ inputs.branch || github.ref }}
    - name: install ISPC
      uses: ./
      with:
        platform: ${{ matrix.platform }}
    - run: ispc --version

  twice:
    # C4: installing twice in one job overwrites like the Node action did.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - uses: ./
        with:
          version: 1.22.0

      - uses: ./
        with:
          version: 1.22.0

      - uses: ./
        with:
          version: 1.23.0

      - name: The last install wins
        shell: bash
        run: ispc --version | grep -F 1.23.0

  caller-defaults:
    # C5: the caller's defaults.run don't leak into the composite steps.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: subdir
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - name: Create the default working directory
        working-directory: .
        run: New-Item -ItemType Directory subdir

      - uses: ./
        with:
          version: 1.23.0

      - name: Extracted into the workspace root
        run: |
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'ispc-releases'))) { exit 1 }
          if (Test-Path 'ispc-releases') { Write-Output "Extracted into subdir"; exit 1 }
          ispc --version

  negative:
    # C6: invalid input fails the step with an error annotation.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - id: bad-version
        continue-on-error: true
        uses: ./
        with:
          version: v1.23.0

      - id: bad-platform
        continue-on-error: true
        uses: ./
        with:
          version: 1.23.0
          platform: macos

      - id: missing-release
        continue-on-error: true
        uses: ./
        with:
          version: 9.9.9

      - id: injection
        continue-on-error: true
        uses: ./
        with:
          version: $(touch pwned)

      - name: All failed, nothing executed
        shell: bash
        run: |
          [[ '${{ steps.bad-version.outcome }}' == failure ]]
          [[ '${{ steps.bad-platform.outcome }}' == failure ]]
          [[ '${{ steps.missing-release.outcome }}' == failure ]]
          [[ '${{ steps.injection.outcome }}' == failure ]]
          [[ ! -e pwned ]]

  hostile-env:
    # C7: the caller's environment doesn't change how install.sh runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      BASH_ENV: ${{ github.workspace }}/test/fixtures/hostile-env.sh
      ENV: ${{ github.workspace }}/test/fixtures/hostile-env.sh
      SHELLOPTS: xtrace
      CDPATH: /tmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - uses: ./
        with:
          version: 1.23.0

      - name: ISPC version
        shell: pwsh
        run: ispc --version

  container:
    # C8 and C10: container jobs with and without the required tools.
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - id: bare
        continue-on-error: true
        uses: ./
        with:
          version: 1.23.0

      - name: Bare image fails with a clear error
        run: '[ "${{ steps.bare.outcome }}" = failure ]'

      - name: Install curl only
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates

      - id: no-jq
        continue-on-error: true
        uses: ./
        with:
          version: latest

      - name: Latest without jq fails with a clear error
        run: '[ "${{ steps.no-jq.outcome }}" = failure ]'

      - name: Pinned version needs neither jq nor git
        uses: ./
        with:
          version: 1.23.0

      - run: ispc --version

      - name: Install jq and git
        run: apt-get install -y -qq --no-install-recommends jq git

      - name: Latest with all tools
        uses: ./

      - run: ispc --version

  windows-arm-bash:
    # C9: Bash sometimes failed to start on windows-11-arm (actions/partner-runner-images#169).
    # Spike: run with workflow_dispatch to try many start-ups; pull requests try a few.
    runs-on: windows-11-arm
    steps:
      - name: Start Git Bash repeatedly from Windows PowerShell
        shell: powershell
        env:
          RUNS: ${{ inputs.spike_runs || '5' }}
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          $failures = 0
          for ($i = 1; $i -le [int]$env:RUNS; $i++) {
            & $bash --noprofile --norc -c 'exit 0'
            if ($LASTEXITCODE -ne 0) { $failures++; Write-Output "Attempt ${i}: exit code $LASTEXITCODE" }
          }
          Write-Output "$failures of $env:RUNS bash start-ups failed"
          if ($failures -gt 0) { exit 1 }

  windows-arm-repeat:
    # C9: the composite launcher itself, repeated on windows-11-arm.
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5]
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - uses: ./
        with:
          version: 1.23.0

      - run: ispc --version
