name: Unit tests

# Tests install.sh on its own. End-to-end tests of the action are in test.yml.

permissions: read-all

on:
  workflow_dispatch:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bash: bash
          # macOS /bin/bash is 3.2, which self-hosted macOS runners may still use.
          - os: macos-15
            bash: /bin/bash
          - os: macos-15
            bash: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        run: ${{ matrix.bash }} test/unit.sh

      - name: Real download timeout tests
        if: runner.os == 'Linux'
        run: python3 test/download-timeout.py

  windows-zip:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ZIP extraction without unzip
        shell: bash
        run: bash test/windows-zip.sh

