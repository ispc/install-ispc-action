name: Unit tests

# Tests install.sh on its own. End-to-end tests of the action are in test.yml.

permissions: read-all

on:
  workflow_dispatch:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bash: bash
          # macOS /bin/bash is 3.2, which self-hosted macOS runners may still use.
          - os: macos-15
            bash: /bin/bash
          - os: macos-15
            bash: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Unit tests
        run: ${{ matrix.bash }} test/unit.sh

      - name: Real download timeout tests
        if: runner.os == 'Linux'
        run: python3 test/download-timeout.py

  windows-zip:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: ZIP extraction without unzip
        shell: bash
        run: bash test/windows-zip.sh

