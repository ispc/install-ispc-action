name: Lint install ISPC action

permissions: read-all

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to checkout (owner/repo)'
        required: true
        default: 'ispc/install-ispc-action'
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'main'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        run: shellcheck install.sh test/*.sh
